services:
  evidencia:
    build: .
    container_name: evidencia-cerne
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - EVIDENCIA_DATA_DIR=/app/data
      - HOST=0.0.0.0
      - PORT=8000
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@evidencias.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - COOKIE_HTTPS=${COOKIE_HTTPS:-0}
